name: Build APKs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Release signing key (docs/SIGNING.md). When these secrets are absent, e.g. for pull requests
      # from forks, the release APK is built unsigned.
      WEARAUTHN_KEYSTORE_BASE64: ${{ secrets.WEARAUTHN_KEYSTORE_BASE64 }}
      WEARAUTHN_KEYSTORE_PASSWORD: ${{ secrets.WEARAUTHN_KEYSTORE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - name: Refuse committed signing keys
        run: |
          # Signing keys must never be committed (docs/SIGNING.md).
          if git ls-files | grep -iE '\.(jks|keystore|p12|pfx)$'; then
            echo "::error::Keystore files are tracked in the repository"
            exit 1
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          # The action's default also requests the obsolete "tools" package, which no longer
          # exists in the SDK repository and makes sdkmanager fail.
          packages: platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 37.2
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.2" "build-tools;37.0.0"
      - name: Set up signing key
        if: env.WEARAUTHN_KEYSTORE_BASE64 != ''
        run: |
          echo "$WEARAUTHN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wearauthn.jks"
          echo "WEARAUTHN_KEYSTORE=$RUNNER_TEMP/wearauthn.jks" >> "$GITHUB_ENV"
      - name: Lint, test, and build release APK
        run: |
          ./gradlew \
            :authenticator:lintPlayStoreDebug \
            :authenticator:testPlayStoreDebugUnitTest \
            :authenticator:assemblePlayStoreRelease
      - name: Verify APK signature
        if: env.WEARAUTHN_KEYSTORE_BASE64 != ''
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs authenticator/build/outputs/apk/playStore/release/authenticator-playStore-release.apk
          sha256sum authenticator/build/outputs/apk/playStore/release/authenticator-playStore-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WearAuthn-apk
          path: authenticator/build/outputs/apk/playStore/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WearAuthn-lint-reports
          path: authenticator/build/reports/lint-results-playStoreDebug.html
          if-no-files-found: ignore
          retention-days: 14
