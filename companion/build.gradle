apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

android {
    compileSdkVersion "android-37.2"


    defaultConfig {
        applicationId "me.ripps.wearauthn"
        minSdk 21
        targetSdk 37
        versionCode makeVersionCode(minSdkVersion.apiLevel, false)
        versionName makeVersionName()
    }
    signingConfigs {
        // Release key, supplied via Gradle properties or environment variables and never committed
        // (see docs/SIGNING.md). Without it, release and signed builds are left unsigned.
        own {
            def keystore = signingValue("WEARAUTHN_KEYSTORE")
            if (keystore) {
                storeFile file(keystore)
                storePassword signingValue("WEARAUTHN_KEYSTORE_PASSWORD")
                keyAlias signingValue("WEARAUTHN_KEY_ALIAS") ?: "wearauthn"
                keyPassword signingValue("WEARAUTHN_KEY_PASSWORD") ?: signingValue("WEARAUTHN_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.own.storeFile ? signingConfigs.own : null
        }
        debug {
            minifyEnabled false
        }
        signed {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.own.storeFile ? signingConfigs.own : null
        }
    }
    flavorDimensions += "distribution"
    productFlavors {
        playStore {
            dimension "distribution"
        }
        nightly {
            dimension "distribution"
            applicationIdSuffix ".nightly"
            versionCode getNightlyVersionCode()
            versionName getNightlyVersionName()
        }
    }

    kotlinOptions {
        jvmTarget = "17"
    }
    namespace 'me.henneke.wearauthn.companion'
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'

    implementation 'com.google.android.gms:play-services-tasks:18.2.0'
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'

    implementation 'com.google.android.material:material:1.12.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
}
